name: Validate

on:
  # No `labeled`/`unlabeled`: nothing here reads labels. The PR scope gate, which
  # does, lives in pr-scope.yml so a label change re-runs only that.
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # check-versions diffs against the base branch

      - uses: actions/setup-node@v5
        with:
          node-version: "20.x"
          cache: "npm"
      - run: npm ci

      # Includes the sync checks: shared/ mirrors inside skill dirs and the
      # generated .claude-plugin/marketplace.json must be up to date.
      - name: Validate skills, bundles, shared resources (strict)
        run: node scripts/validate.mjs

      - name: Versions are semver
        run: node scripts/check-versions.mjs

      - name: Changed skills/bundles bumped their version
        if: github.event_name == 'pull_request'
        run: node scripts/check-versions.mjs --base "origin/${{ github.base_ref }}"

      - name: Security scan (shipped scripts)
        run: node scripts/scan-security.mjs

      - name: Unit tests (node:test)
        run: npm test

      - name: Build index (smoke)
        run: node scripts/build-index.mjs --tag ci --out dist/index.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python tests (stdlib only; skipped when none exist)
        run: node scripts/run-python-tests.mjs
