name: PR scope

# The PR scope gate on its own, so a label change re-runs only this (seconds).
#
# `labeled`/`unlabeled` matter because the gate reads PR_LABELS: applying
# `core-change` to an open PR must re-run it. A plain re-run replays the original
# event payload (labels as they were), so without these types the only way to a
# green check would be an empty retrigger commit.
#
# Deliberately no `if:` on the label name: a job skipped by `if:` reports a
# successful "skipped" check on the same commit, hiding an earlier red result.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: pr-scope-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # diff against the base branch

      - uses: actions/setup-node@v5
        with:
          node-version: "20.x"
          cache: "npm"
      - run: npm ci

      - name: PR scope gate (add-only unless core-change label)
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node scripts/check-pr-scope.mjs
