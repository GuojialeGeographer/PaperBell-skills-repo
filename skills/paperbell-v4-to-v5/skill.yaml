id: paperbell-v4-to-v5
version: 1.0.0
title:
  en: Upgrade a PaperBell 4.x vault to 5.x (CIMPO)
  zh: PaperBell 4.x 库升级到 5.x（CIMPO）
description:
  en: Plans the move of a PaperBell 4.x vault onto the 5.x CIMPO layout (10 Cards / 20 Inputs / 30 Metadata / 40 Projects / 50 Outputs), hands the plan to the PaperBell plugin to execute with link updates, then walks you through the judgment calls and verifies the result.
  zh: 为 PaperBell 4.x 库生成迁移到 5.x CIMPO 结构（10 Cards / 20 Inputs / 30 Metadata / 40 Projects / 50 Outputs）的计划，交给 PaperBell 插件执行（自动更新链接），再陪你处理需要判断的事项并验收。
tier: core
agents: [claude-code, github-copilot, openai-codex, gemini-cli]
requires: []
free: true
minPluginVersion: 0.5.0
tags: [migration, cimpo]
